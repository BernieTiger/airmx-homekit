# 2026-11-13 修正：移除 acl_file
# 原因：mosquitto 的 topic 规则写在 user 段前只对匿名客户端生效，
#       带用户名连接的客户端（设备用 aw_<id>、网关与桥接也带用户名）会被全部拒绝，
#       表现为“连得上、订阅成功、但收不到任何消息”。
# 本服务仅监听局域网 1883，且为家庭自用诊断场景，因此不做主题级鉴权。
listener 1883
allow_anonymous true
persistence false
retain_available false
connection_messages false
log_dest stdout
log_type error
max_connections 8
max_packet_size 32768
message_size_limit 16384
max_queued_messages 50
max_inflight_messages 10
